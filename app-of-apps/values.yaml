apps:
  argo-cd:
    namespace: argocd
    project: default

  cilium:
    namespace: kube-system
    project: infrastructure

  gateway-api:
    namespace: kube-system
    project: infrastructure
    type: directory
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    path: config/crd/standard
    # renovate: datasource=github-tags depName=kubernetes-sigs/gateway-api
    targetRevision: v1.7.0

  metrics-server:
    namespace: kube-system
    project: infrastructure

  nvidia-device-plugin:
    namespace: nvidia-device-plugin
    project: infrastructure
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      managedNamespaceMetadata:
        labels:
          pod-security.kubernetes.io/enforce: privileged
      syncOptions:
        - CreateNamespace=true
        - RespectIgnoreDifferences=true

  external-secrets:
    namespace: external-secrets
    project: infrastructure
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - RespectIgnoreDifferences=true
        - ServerSideApply=true

  cert-manager:
    namespace: tools
    project: infrastructure

  external-dns:
    namespace: tools
    project: infrastructure

  longhorn:
    namespace: longhorn-system
    project: infrastructure

  cloudflare-tunnel:
    namespace: cloudflare
    project: infrastructure

  seaweedfs:
    namespace: seaweedfs
    project: infrastructure

  renovate:
    namespace: renovate
    project: infrastructure

  observability:
    namespace: observability
    project: infrastructure
    syncPolicy:
      syncOptions:
        - RespectIgnoreDifferences=true
        - ServerSideApply=true

  homelab-argo-apps:
    namespace: argocd
    project: apps
    repoURL: https://github.com/Raiyajin/homelab-argo-apps.git
    path: app-of-apps

  mythic-wizards-argo-apps:
    namespace: argocd
    project: w101
    repoURL: https://github.com/mythic-wizards/argo-apps.git
    path: app-of-apps

repoURL: https://github.com/Raiyajin/homelab-setup.git

defaults:
  type: helm
  project: default
  finalizer: false
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences: []

cluster: "https://kubernetes.default.svc"
