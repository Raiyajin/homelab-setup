cilium:
  ipam:
    mode: kubernetes
    operator:
      clusterPoolIPv4PodCIDRList: ["10.244.0.0/16"]

  kubeProxyReplacement: true
  k8sServiceHost: localhost
  k8sServicePort: 7445
  
  prometheus:
    enabled: true
    metricsService: true
    serviceMonitor:
      enabled: true
  operator:
    prometheus:
      metricsService: true
      serviceMonitor:
        enabled: true
  envoy:
    prometheus:
      serviceMonitor:
        enabled: true
  hubble:
    metrics:
      enabled:
        - dns
        - drop
        - tcp
        - flow
        - icmp
      serviceMonitor:
        enabled: true
    ui:
      enabled: true
    relay:
      enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true

      tls:
        enabled: true
        mtls: true
    
    tls:
      enabled: true
      auto:
        enabled: true
        method: certmanager

        certManagerIssuerRef:
          group: cert-manager.io
          kind: ClusterIssuer
          name: openbao-homelab

  securityContext:
    capabilities:
      ciliumAgent:
        - BPF
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState: 
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE
  cgroup:
    autoMount: 
      enabled: false
    hostRoot: "/sys/fs/cgroup"

  gatewayAPI:
    enabled: true
    enableAlpn: true
    hostNetwork:
      enabled: false

  l2announcements:
    enabled: true
  

loadBalancers:
  internal: 
    blocks:
      - cidr: "10.50.0.201/29"
  public: 
    blocks:
      - cidr: "10.50.0.209/29"

gateway:
  internal:
    certIssuer: "openbao-homelab"
    addresses:
    - type: IPAddress
      value: "10.50.0.201"
      
    listeners:
    - name: argocd-https
      protocol: HTTPS
      port: 443
      hostname: "argocd.homelab.internal"
      tls:
        mode: Terminate
        certificateRefs:
        - name: argocd-tls-secret
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: argocd

    - name: longhorn-https
