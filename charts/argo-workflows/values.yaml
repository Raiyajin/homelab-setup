# Default values: https://github.com/argoproj/argo-helm/blob/main/charts/argo-workflows/values.yaml
argo-workflows:
  # Full CRDs (~1.2MB each, installed by a hook Job on every sync) OOM the Argo CD controller
  crds:
    full: false

  controller:
    workflowNamespaces:
      - argo
    workflowDefaults:
      spec:
        # Keeps finished workflows (and their pod logs) for a day
        ttlStrategy:
          secondsAfterCompletion: 86400

    # Prometheus metrics on :9090, scraped through the ServiceMonitor
    metricsConfig:
      enabled: true
    serviceMonitor:
      enabled: true

    # Traces only (metrics stay on Prometheus), sent over TLS to the Tempo OTLP gRPC route
    extraEnv:
      - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        value: https://tempo-otlp.homelab.internal:4317
      - name: OTEL_EXPORTER_OTLP_TRACES_CERTIFICATE
        value: /etc/ssl/homelab/trust-bundle.pem
    volumes:
      - name: ca-trust-bundle
        configMap:
          name: ca-trust-bundle
    volumeMounts:
      - name: ca-trust-bundle
        mountPath: /etc/ssl/homelab
        readOnly: true

  # Creates the `argo-workflow` SA that workflow pods run as
  workflow:
    serviceAccount:
      create: true

  server:
    # `sso`: UI login through Authentik, users act as the SA their groups match (templates/sso-rbac.yaml).
    # `client`: bearer tokens for the CLI; GitHub webhooks are mapped to the `github.com` SA
    # (templates/webhook.yaml). Not `server`: anyone on the LAN could submit a workflow that reads the GitHub token.
    authModes:
      - sso
      - client
    sso:
      enabled: true
      issuer: https://auth.homelab.internal/application/o/argo-workflows/
      redirectUrl: https://argo-workflows.homelab.internal/oauth2/callback
      # `profile` carries the `groups` claim (Authentik)
      scopes:
        - profile
        - email
    # Trusts the homelab CA (auth.homelab.internal), the bundle also holds the public CAs
    extraEnv:
      - name: SSL_CERT_FILE
        value: /etc/ssl/homelab/trust-bundle.pem
    volumes:
      - name: ca-trust-bundle
        configMap:
          name: ca-trust-bundle
    volumeMounts:
      - name: ca-trust-bundle
        mountPath: /etc/ssl/homelab
        readOnly: true
