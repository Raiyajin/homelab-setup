apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-workflows
  namespace: argo
spec:
  parentRefs:
  - name: internal
    namespace: kube-system
  hostnames:
  - "argo-workflows.homelab.internal"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: argo-workflows-server
      port: 2746
---
# Only the GitHub events endpoint is public
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-workflows-webhook
  namespace: argo
spec:
  parentRefs:
  - name: webhooks
    namespace: kube-system
  hostnames:
  - "webhooks.lmo-software.fr"
  rules:
  - matches:
    - path:
        type: Exact
        value: /api/v1/events/argo/github
    backendRefs:
    - name: argo-workflows-server
      port: 2746
