# SSO users from the homelab-admins Authentik group act as this SA
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-admin
  namespace: argo
  annotations:
    workflows.argoproj.io/rbac-rule: "'homelab-admins' in groups"
    workflows.argoproj.io/rbac-rule-precedence: "1"
---
apiVersion: v1
kind: Secret
metadata:
  name: argo-admin.service-account-token
  namespace: argo
  annotations:
    kubernetes.io/service-account.name: argo-admin
type: kubernetes.io/service-account-token
---
# Chart's aggregated admin role, bound in `argo` only (the only workflow namespace)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-admin
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-workflows-admin
subjects:
- kind: ServiceAccount
  name: argo-admin
  namespace: argo
---
# The chart's admin role has no pod rights: UI retry deletes the reset nodes' pods, and logs read pods/log
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-admin-pods
  namespace: argo
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch, delete]
- apiGroups: [""]
  resources: [pods/log]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-admin-pods
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-admin-pods
subjects:
- kind: ServiceAccount
  name: argo-admin
  namespace: argo
