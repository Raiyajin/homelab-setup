# Classic PAT, scopes: repo (clone private repos + statuses), write:packages (fine-grained PATs can't use GHCR)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-pat
  namespace: argo
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: openbao-homelab
    kind: ClusterSecretStore
  target:
    name: github-pat
    template:
      data:
        token: '{{ "{{ .token }}" }}'
        # git artifacts need a username key, GitHub only checks the token
        username: Raiyajin
  data:
  - secretKey: token
    remoteRef:
      key: kubernetes/talos-cluster/argo-workflows/github/pat
      property: token
---
# Maps the GitHub webhook HMAC secret to the `github.com` SA (templates/webhook.yaml)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-workflows-webhook-clients
  namespace: argo
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: openbao-homelab
    kind: ClusterSecretStore
  target:
    name: argo-workflows-webhook-clients
    template:
      data:
        github.com: |
          type: github
          secret: {{ "{{ .secret | quote }}" }}
  data:
  - secretKey: secret
    remoteRef:
      key: kubernetes/talos-cluster/argo-workflows/github/webhook
      property: secret
