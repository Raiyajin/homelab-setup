apiVersion: v2
name: github-runners
description: GitHub Actions self-hosted runners (Actions Runner Controller)

type: application

version: 0.1.0

appVersion: "0.15.1"

dependencies:
  - name: gha-runner-scale-set-controller
    alias: controller
    version: 0.15.1
    repository: oci://ghcr.io/actions/actions-runner-controller-charts
  # One scale set per GitHub target: personal repos can't share an org-level set
  - name: gha-runner-scale-set
    alias: homelab-charts
    version: 0.15.1
    repository: oci://ghcr.io/actions/actions-runner-controller-charts
  - name: gha-runner-scale-set
    alias: mythic-wizards
    version: 0.15.1
    repository: oci://ghcr.io/actions/actions-runner-controller-charts
