{{- range $name, $key := .Values.githubApps }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: openbao-homelab
    kind: ClusterSecretStore
  target:
    name: {{ $name }}
  data:
  # Key names expected by ARC's githubConfigSecret
  - secretKey: github_app_id
    remoteRef:
      key: {{ $key }}
      property: app_id
  - secretKey: github_app_installation_id
    remoteRef:
      key: {{ $key }}
      property: installation_id
  - secretKey: github_app_private_key
    remoteRef:
      key: {{ $key }}
      property: private_key
---
{{- end }}
