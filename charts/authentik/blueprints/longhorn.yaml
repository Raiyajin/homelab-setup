# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Longhorn has no login: the embedded outpost (in authentik-server) proxies it after an Authentik login.
# Its HTTPRoute sends longhorn.homelab.internal to authentik-server (charts/longhorn/templates/route.yaml)
version: 1
metadata:
  name: homelab Longhorn
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: longhorn-provider
    identifiers:
      name: longhorn
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: proxy
      external_host: https://longhorn.homelab.internal
      internal_host: http://longhorn-frontend.longhorn-system.svc:80

  - model: authentik_core.application
    id: longhorn-app
    identifiers:
      slug: longhorn
    attrs:
      name: Longhorn
      provider: !KeyOf longhorn-provider
      meta_launch_url: https://longhorn.homelab.internal

  # Only homelab-admins can log in (group defined in argocd.yaml)
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf longhorn-app
      group: !Find [authentik_core.group, [name, homelab-admins]]
    attrs:
      order: 0

  # Replaces the outpost's provider list: keep every proxy provider here
  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      providers:
        - !KeyOf longhorn-provider
