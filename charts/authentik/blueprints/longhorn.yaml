# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Longhorn has no login: the embedded outpost (in authentik-server) proxies it after an Authentik login.
# Its HTTPRoute sends longhorn.homelab.internal to authentik-server (charts/longhorn/templates/route.yaml)
version: 1
metadata:
  name: homelab Longhorn
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: longhorn-provider
    identifiers:
      name: longhorn
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: proxy
      external_host: https://longhorn.homelab.internal
      internal_host: http://longhorn-frontend.longhorn-system.svc:80

  - model: authentik_core.application
    id: longhorn-app
    identifiers:
      slug: longhorn
    attrs:
      name: Longhorn
      provider: !KeyOf longhorn-provider
      meta_launch_url: https://longhorn.homelab.internal

  # Only homelab-admins can log in (group defined in argocd.yaml)
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf longhorn-app
      group: !Find [authentik_core.group, [name, homelab-admins]]
    attrs:
      order: 0

  # Other proxy providers must exist before the outpost list below references them
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: homelab lol-draft
      required: true

  # Replaces the outpost's provider list: keep every proxy provider here
  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      # Replaces the whole config: the defaults plus the browser login host, public so Discord users can reach it
      # (LAN clients reach it too, through the router's NAT reflection)
      config:
        log_level: info
        authentik_host: https://auth.homelab.internal
        authentik_host_browser: https://auth.lmo-software.fr
        authentik_host_insecure: false
        refresh_interval: minutes=5
        object_naming_template: ak-outpost-%(name)s
        docker_labels: null
        docker_network: null
        docker_map_ports: true
        container_image: null
        kubernetes_replicas: 1
        kubernetes_namespace: authentik
        kubernetes_service_type: ClusterIP
        kubernetes_ingress_path_type: null
        kubernetes_image_pull_secrets: []
        kubernetes_ingress_class_name: null
        kubernetes_disable_x509_strict: false
        kubernetes_disabled_components: []
        kubernetes_ingress_annotations: {}
        kubernetes_ingress_secret_name: authentik-outpost-tls
        kubernetes_httproute_annotations: {}
        kubernetes_httproute_parent_refs: []
        kubernetes_json_patches: null
      providers:
        - !KeyOf longhorn-provider
        # blueprints/lol-draft.yaml
        - !Find [authentik_providers_proxy.proxyprovider, [name, lol-draft]]
