# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: homelab Argo Workflows
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: argo-workflows-provider
    identifiers:
      name: argo-workflows
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: argo-workflows
      client_secret: !Env ARGO_WORKFLOWS_OIDC_CLIENT_SECRET
      # Empty when created from a blueprint (the UI fills it), authorize then fails as "malformed"
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: https://argo-workflows.homelab.internal/oauth2/callback
          redirect_uri_type: authorization
      # `profile` is authentik's own mapping, it adds the `groups` claim the SA rbac-rule reads
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    id: argo-workflows-app
    identifiers:
      slug: argo-workflows
    attrs:
      name: Argo Workflows
      provider: !KeyOf argo-workflows-provider
      meta_launch_url: https://argo-workflows.homelab.internal

  # Only homelab-admins can log in (group defined in argocd.yaml)
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf argo-workflows-app
      group: !Find [authentik_core.group, [name, homelab-admins]]
    attrs:
      order: 0
