# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Pickban companion (Windows app, lol-draft repo companion/): logs in through the browser (Discord) with PKCE and a
# loopback redirect, then calls pickban.lmo-software.fr with `Authorization: Bearer`. The lol-draft proxy outpost
# introspects that token; Authentik finds it only when the token's provider (this one) lists the asking provider in
# jwt_federation_providers (providers/oauth2/views/introspection.py). Public client: no secret.
version: 1
metadata:
  name: homelab pickban companion
entries:
  # lol-draft-users is created by discord.yaml
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: homelab discord
      required: true
  # the lol-draft proxy provider, listed below
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: homelab lol-draft
      required: true

  - model: authentik_providers_oauth2.oauth2provider
    id: pickban-companion-provider
    identifiers:
      name: pickban-companion
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      client_id: pickban-companion
      grant_types:
        - authorization_code
        - refresh_token
      # the app listens on a random local port for the redirect
      redirect_uris:
        - matching_mode: regex
          url: 'http://127\.0\.0\.1:\d+/callback'
          redirect_uri_type: authorization
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: minutes=10
      # losing the Discord role takes effect at the next refresh after the policy check
      refresh_token_validity: days=30
      # the proxy outpost in front of pickban.lmo-software.fr may introspect this provider's tokens
      jwt_federation_providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, lol-draft]]

  - model: authentik_core.application
    id: pickban-companion-app
    identifiers:
      slug: pickban-companion
    attrs:
      name: Pickban companion
      provider: !KeyOf pickban-companion-provider

  # same people as the website (lol-draft.yaml)
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf pickban-companion-app
      group: !Find [authentik_core.group, [name, homelab-admins]]
    attrs:
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf pickban-companion-app
      group: !Find [authentik_core.group, [name, lol-draft-users]]
    attrs:
      order: 1
