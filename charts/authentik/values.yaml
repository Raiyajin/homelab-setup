# Default values: https://github.com/goauthentik/helm/blob/main/charts/authentik/values.yaml
authentik:
  global:
    # Secret key and DB password, synced from OpenBao (templates/external-secrets.yaml)
    envFrom:
      - secretRef:
          name: authentik-secrets

  # Apps, providers and groups as code (blueprints/, templates/blueprints.yaml)
  blueprints:
    configMaps:
      - authentik-blueprints

  authentik:
    error_reporting:
      enabled: false
    postgresql:
      host: "{{ .Release.Name }}-postgres"
      name: authentik
      user: authentik

  server:
    # Uploaded files (templates/pvc.yaml); RWO volume, so the old pod must stop before the new one starts
    deploymentStrategy:
      type: Recreate
    securityContext:
      fsGroup: 1000
    volumes:
      - name: data
        persistentVolumeClaim:
          claimName: authentik-data
    volumeMounts:
      - name: data
        mountPath: /data
    route:
      main:
        enabled: true
        # auth.lmo-software.fr: the public login page (Discord users of Pickban), on the public Gateway
        # (Raiyajin/homelab-argo-apps apps/media-server values.yaml); external-dns publishes it
        hostnames:
          - auth.homelab.internal
          - auth.lmo-software.fr
        parentRefs:
          - name: internal
            namespace: kube-system
          - name: public-media
            namespace: media-server
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 150m
        memory: 512Mi
      limits:
        memory: 1Gi

  worker:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        memory: 1Gi

postgres:
  # OOMKilled at the 512Mi default, peaks ~400Mi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi
  externalSecret:
    enabled: true
    data:
      - secretKey: POSTGRES_PASSWORD
        remoteKey: kubernetes/talos-cluster/authentik/config
        property: postgres_password
  env:
    - name: POSTGRES_USER
      value: authentik
    - name: POSTGRES_DB
      value: authentik
