# Generate the values once, don't change secret_key after the first install:
#   bao kv put -mount=kubernetes/talos-cluster authentik/config \
#     secret_key="$(openssl rand -base64 60 | tr -d '\n')" postgres_password="$(openssl rand -hex 32)"
# Argo CD OIDC client secret, also read by Argo CD:
#   bao kv put -mount=kubernetes/talos-cluster argo-cd/oidc client_secret="$(openssl rand -hex 32)"
# Argo Workflows OIDC client secret, also read by Argo Workflows:
#   bao kv put -mount=kubernetes/talos-cluster argo-workflows/oidc client_secret="$(openssl rand -hex 32)"
# Discord login (blueprints/discord.yaml): the Discord application's OAuth2 client, the server (guild) id and the role id
# (Discord: Settings > Advanced > Developer Mode, then right-click the server / the role > Copy ID):
#   bao kv put -mount=kubernetes/talos-cluster authentik/discord client_id=... client_secret=... guild_id=... role_id=...
# Grafana OIDC client secret, also read by Grafana:
#   bao kv put -mount=kubernetes/talos-cluster observability/grafana/oidc client_secret="$(openssl rand -hex 32)"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-homelab
    kind: ClusterSecretStore
  target:
    name: authentik-secrets
  data:
  - secretKey: AUTHENTIK_SECRET_KEY
    remoteRef:
      key: kubernetes/talos-cluster/authentik/config
      property: secret_key
  - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
    remoteRef:
      key: kubernetes/talos-cluster/authentik/config
      property: postgres_password
  # Read by blueprints/argocd.yaml, pods must restart to pick up a changed value
  - secretKey: ARGOCD_OIDC_CLIENT_SECRET
    remoteRef:
      key: kubernetes/talos-cluster/argo-cd/oidc
      property: client_secret
  # Read by blueprints/argo-workflows.yaml, pods must restart to pick up a changed value
  - secretKey: ARGO_WORKFLOWS_OIDC_CLIENT_SECRET
    remoteRef:
      key: kubernetes/talos-cluster/argo-workflows/oidc
      property: client_secret
  # Read by blueprints/grafana.yaml, pods must restart to pick up a changed value
  - secretKey: GRAFANA_OIDC_CLIENT_SECRET
    remoteRef:
      key: kubernetes/talos-cluster/observability/grafana/oidc
      property: client_secret
  # Read by blueprints/discord.yaml, pods must restart to pick up a changed value
  - secretKey: DISCORD_CLIENT_ID
    remoteRef:
      key: kubernetes/talos-cluster/authentik/discord
      property: client_id
  # Read by blueprints/discord.yaml, pods must restart to pick up a changed value
  - secretKey: DISCORD_CLIENT_SECRET
    remoteRef:
      key: kubernetes/talos-cluster/authentik/discord
      property: client_secret
  # Read by blueprints/discord.yaml, pods must restart to pick up a changed value
  - secretKey: DISCORD_GUILD_ID
    remoteRef:
      key: kubernetes/talos-cluster/authentik/discord
      property: guild_id
  # Read by blueprints/discord.yaml, pods must restart to pick up a changed value
  - secretKey: DISCORD_ROLE_ID
    remoteRef:
      key: kubernetes/talos-cluster/authentik/discord
      property: role_id
