
longhorn:
  global:
    nodeSelector:
      "proxmox.com/disk.scsi1-datastore-id": "kubernetes"

  namespaceOverride: longhorn-system

  preUpgradeChecker:
    # -- Setting that allows Longhorn to perform pre-upgrade checks. Disable this setting when installing Longhorn using Argo CD or other GitOps solutions.
    jobEnabled: false

  defaultSettings:
    # path for secondary disk on worker talos nodes
    defaultDataPath: /var/mnt/storage

  metrics:
    serviceMonitor:
      enabled: true

  networkPolicies:
    # longhorn-manager netpol otherwise drops prometheus on 9500
    metricsScrapeSources:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: observability
        podSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus
