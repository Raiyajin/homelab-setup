apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-frontend
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: internal
    namespace: kube-system 
  hostnames:
  - "longhorn.homelab.internal"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    # Longhorn has no login: Authentik's embedded outpost proxies to longhorn-frontend after login
    # (charts/authentik/blueprints/longhorn.yaml)
    backendRefs:
    - name: authentik-server
      namespace: authentik
      port: 80 
