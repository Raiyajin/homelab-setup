apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-github-webhook
  namespace: argocd
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: openbao-homelab
    kind: ClusterSecretStore
  target:
    name: argocd-github-webhook
    template:
      metadata:
        labels:
          # required for argocd-secret to reference it ($argocd-github-webhook:secret)
          app.kubernetes.io/part-of: argocd
  data:
  - secretKey: secret
    remoteRef:
      key: kubernetes/talos-cluster/argo-cd/github/webhook
      property: secret
