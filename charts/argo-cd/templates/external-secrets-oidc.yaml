# Same value as Authentik's ARGOCD_OIDC_CLIENT_SECRET (charts/authentik/blueprints/argocd.yaml)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-homelab
    kind: ClusterSecretStore
  target:
    name: argocd-oidc
    template:
      metadata:
        labels:
          # required for oidc.config to reference it ($argocd-oidc:client_secret)
          app.kubernetes.io/part-of: argocd
  data:
  - secretKey: client_secret
    remoteRef:
      key: kubernetes/talos-cluster/argo-cd/oidc
      property: client_secret
