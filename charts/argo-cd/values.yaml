# Default values: https://github.com/argoproj/argo-helm/blob/master/charts/argo-cd/values.yaml
global:
  domain: argocd.homelab.internal


repoURL: https://github.com/Raiyajin/homelab-setup.git

repositories:
  # No project: global credentials, usable by every project whose sourceRepos allows the URL
  - name: ghcr-charts
    type: helm
    url: ghcr.io/raiyajin/charts
    enableOCI: true
    authType: pat
    vaultPath: "kubernetes/talos-cluster/argo-cd/github/pat/homelab-ghcr-argocd"
    secret-type: repository

  - name: argo-apps
    type: git
    project: apps
    url: https://github.com/Raiyajin/homelab-argo-apps.git
    authType: githubApp
    vaultPath: "kubernetes/talos-cluster/argo-cd/github/github-apps/homelab-infra-argocd"
    secret-type: repository

  - name: w101
    type: git
    project: w101
    url: https://github.com/mythic-wizards/argo-apps.git
    authType: githubApp
    vaultPath: "kubernetes/talos-cluster/argo-cd/github/github-apps/mythic-wizards-argocd"
    secret-type: repository

projects:
  infrastructure:
    destinations:
      - namespace: '*'
    sourceRepos:
      - https://github.com/kubernetes-sigs/gateway-api.git
      - ghcr.io/raiyajin/charts
      - ghcr.io/goauthentik/helm-charts
  apps:
    destinations:
      - namespace: '!kube-system'
    sourceRepos:
      - https://github.com/Raiyajin/homelab-argo-apps.git
      - ghcr.io/raiyajin/charts
  w101:
    destinations:
      - namespace: 'wiz101'
      - namespace: 'argocd'
    sourceRepos:
      - https://github.com/mythic-wizards/argo-apps.git

argo-cd:

  configs:
    params:
      server.insecure: true
      # traces to alloy -> tempo (only server and repo-server read it)
      otlp.address: observability-alloy.observability.svc:4317
      otlp.insecure: true
    secret:
      # resolved from the ExternalSecret synced from OpenBao
      githubSecret: "$argocd-github-webhook:secret"
    # SSO through Authentik (charts/authentik/blueprints/argocd.yaml), local admin stays as break-glass
    cm:
      oidc.config: |
        name: Authentik
        issuer: https://auth.homelab.internal/application/o/argocd/
        clientID: argocd
        clientSecret: $argocd-oidc:client_secret
        requestedScopes: [openid, profile, email]
    rbac:
      policy.csv: |
        g, homelab-admins, role:admin

  server:
    metrics: &metrics
      enabled: true
      serviceMonitor:
        enabled: true
    # Trusts the homelab CA (auth.homelab.internal), the bundle also holds the public CAs
    env:
      - name: SSL_CERT_FILE
        value: /etc/ssl/homelab/trust-bundle.pem
    volumes:
      - name: ca-trust-bundle
        configMap:
          name: ca-trust-bundle
          # don't block the UI if trust-manager hasn't copied it yet (Go then uses the image CAs)
          optional: true
    volumeMounts:
      - name: ca-trust-bundle
        mountPath: /etc/ssl/homelab
        readOnly: true
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi

  controller:
    metrics: *metrics
    resources:
      limits:
        cpu: 1
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 256Mi

  redis:
    exporter:
      enabled: true
    metrics: *metrics
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 64Mi

  dex:
    enabled: false
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 32Mi

  repoServer:
    resources:
      limits:
        cpu: 2000m
        memory: 2Gi
      requests:
        cpu: 1000m
        memory: 1Gi
  repoServer:
    metrics: *metrics
  applicationSet:
    metrics: *metrics
  notifications:
    metrics: *metrics
