apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.renovate.existingSecret }}
  namespace: {{ .Values.global.namespace }}
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: openbao-homelab
    kind: ClusterSecretStore
  target:
    name: {{ .Values.renovate.existingSecret }}
    template:
      # keep the plain keys below, only add the rendered host rules
      mergePolicy: Merge
      data:
        # pull access to the private ghcr.io/raiyajin/charts, reusing Argo CD's GHCR token
        RENOVATE_HOST_RULES: '[{"matchHost":"ghcr.io","username":"{{"{{ .ghcr_username }}"}}","password":"{{"{{ .ghcr_password }}"}}"}]'
  data:
  - secretKey: RENOVATE_TOKEN
    remoteRef:
      key: kubernetes/talos-cluster/renovate/github-token
      property: token
  # same token, avoids GitHub rate limits when fetching release notes
  - secretKey: RENOVATE_GITHUB_COM_TOKEN
    remoteRef:
      key: kubernetes/talos-cluster/renovate/github-token
      property: token
  - secretKey: RENOVATE_GIT_PRIVATE_KEY
    remoteRef:
      key: kubernetes/talos-cluster/renovate/github-token
      property: signing-key
  - secretKey: ghcr_username
    remoteRef:
      key: kubernetes/talos-cluster/argo-cd/github/pat/homelab-ghcr-argocd
      property: username
  - secretKey: ghcr_password
    remoteRef:
      key: kubernetes/talos-cluster/argo-cd/github/pat/homelab-ghcr-argocd
      property: password
