apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-access-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: openbao-homelab
    kind: ClusterSecretStore
  target:
    name: garage-access-credentials
  data:
  - secretKey: access-key
    remoteRef:
      key: kubernetes/talos-cluster/garage/garage/access-credentials
      property: access-key
  - secretKey: secret-key
    remoteRef:
      key: kubernetes/talos-cluster/garage/garage/access-credentials
      property: secret-key
