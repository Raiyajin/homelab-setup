apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-access-credentials-admin
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: openbao-homelab
    kind: ClusterSecretStore
  target:
    name: s3-access-credentials-admin
  data:
  - secretKey: access-key
    remoteRef:
      key: kubernetes/talos-cluster/seaweedfs/s3/access-credentials/admin
      property: access-key
  - secretKey: secret-key
    remoteRef:
      key: kubernetes/talos-cluster/seaweedfs/s3/access-credentials/admin
      property: secret-key
