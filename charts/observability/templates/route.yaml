{{- range $name, $route := .Values.routes }}
apiVersion: gateway.networking.k8s.io/v1
kind: {{ $route.kind | default "HTTPRoute" }}
metadata:
  name: {{ $name }}
  {{- with $route.gateway.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $route.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ $route.gateway.name | default "internal" }}
      namespace: {{ $route.gateway.namespace | default "kube-system" }}
  {{- if $route.host }}
  hostnames:
    - {{ $route.host | quote }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ $route.service.name }}
          port: {{ $route.service.port }}
      {{- if or (empty $route.kind) (eq $route.kind "HTTPRoute") }}
      matches:
        - path:
            type: PathPrefix
            value: "/"
      {{- end }}
---
{{- end }}