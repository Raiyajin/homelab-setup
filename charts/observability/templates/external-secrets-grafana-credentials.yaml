apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: openbao-homelab
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
  data:
  - secretKey: user
    remoteRef:
      key: kubernetes/talos-cluster/observability/grafana/admin-credentials
      property: user
  - secretKey: password
    remoteRef:
      key: kubernetes/talos-cluster/observability/grafana/admin-credentials
      property: password
---
# OIDC client for SSO, same value as Authentik's GRAFANA_OIDC_CLIENT_SECRET
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-homelab
    kind: ClusterSecretStore
  target:
    name: grafana-oidc
  data:
  - secretKey: client_secret
    remoteRef:
      key: kubernetes/talos-cluster/observability/grafana/oidc
      property: client_secret
