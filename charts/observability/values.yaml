routes:
  prometheus:
    gateway:
      name: internal
      namespace: kube-system
    host: "prometheus.homelab.internal"
    service:
      name: observability-promstack-prometheus
      port: 9090
  alertmanager:
    gateway:
      name: internal
      namespace: kube-system
    host: "alertmanager.homelab.internal"
    service:
      name: observability-promstack-alertmanager
      port: 9093
  grafana:
    gateway:
      name: internal
      namespace: kube-system
    host: "grafana.homelab.internal"
    service:
      name: observability-grafana
      port: 80
  tempo:
    gateway:
      name: internal
      namespace: kube-system
    host: "tempo.homelab.internal"
    service:
      name: observability-tempo
      port: 3200
  tempo-otlp-grpc:
    kind: GRPCRoute
    gateway:
      name: internal
      namespace: kube-system
    host: "tempo.homelab.internal"
    service:
      name: observability-tempo
      port: 4317
  loki-gateway:
    gateway:
      name: internal
      namespace: kube-system
    host: "loki-gateway.homelab.internal"
    service:
      name: observability-loki-gateway
      port: 80

promstack:
  crds:
    enabled: true
    upgradeJob:
      enabled: true

  grafana:
    enabled: true
    admin:
      existingSecret: "grafana-admin-credentials"
      userKey: "user"
      passwordKey: "password"

    sidecar:
      datasources:
        enabled: true
        defaultDatasourceEnabled: true
        isDefaultDatasource: true

        name: Prometheus
        uid: prometheus

        ## Extra jsonData properties to add to the datasource
        # extraJsonData:
        #  prometheusType: Prometheus

        url: https://prometheus.homelab.internal

        ## Prometheus request timeout in seconds
        # timeout: 30

        ## Query parameters to add, as a URL-encoded string,
        ## to query Prometheus
        # customQueryParameters: ""

        # If not defined, will use prometheus.prometheusSpec.scrapeInterval or its default
        # defaultDatasourceScrapeInterval: 15s

        ## Annotations for Grafana datasource configmaps
        ##
        annotations: {}

        ## Set method for HTTP to send query to datasource
        httpMethod: POST

        ## Create datasource for each Pod of Prometheus StatefulSet;
        ## this uses by default the headless service `prometheus-operated` which is
        ## created by Prometheus Operator. In case you deployed your own Service for your
        ## Prometheus instance, you can specify it with the field `prometheusServiceName`
        ## ref: https://github.com/prometheus-operator/prometheus-operator/blob/0fee93e12dc7c2ea1218f19ae25ec6b893460590/pkg/prometheus/statefulset.go#L255-L286
        createPrometheusReplicasDatasources: false
        prometheusServiceName: prometheus-operated
        label: grafana_datasource
        labelValue: "1"

        ## Field with internal link pointing to existing data source in Grafana.
        ## Can be provisioned via additionalDataSources
        exemplarTraceIdDestinations: {}
          # datasourceUid: Jaeger
          # traceIdLabelName: trace_id
          # urlDisplayLabel: View traces
        alertmanager:
          enabled: false
          name: Alertmanager
          uid: alertmanager
          handleGrafanaManagedAlerts: false
          implementation: prometheus

    additionalDataSources:
      - name: Alertmanager
        type: alertmanager
        access: proxy
        url: https://alertmanager.homelab.internal
        jsonData:
          handleGrafanaManagedAlerts: false
          implementation: prometheus

      - name: Loki
        type: loki
        access: proxy
        url: https://loki-gateway.homelab.internal
        jsonData:
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: "trace_id=(\\w+)"
              name: TraceID
              url: "$${__value.raw}"
          httpHeaderName1: "X-Scope-OrgID"
        secureJsonData:
          httpHeaderValue1: "infrastructure"

      - name: Tempo
        type: tempo
        access: proxy
        url: https://tempo.homelab.internal
        jsonData:
          httpMethod: GET
          serviceMap:
            datasourceUid: prometheus

    extraConfigmapMounts:
    - name: ca-trust-bundle
      mountPath: /etc/ssl/certs/ca-certificates.crt
      subPath: trust-bundle.pem
      configMap: ca-trust-bundle
      readOnly: true

  prometheus:
    prometheusSpec:
      retention: 7d
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi

loki:
  extraEnvFrom:
    - secretRef:
        name: s3-access-credentials-admin
  loki:
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2026-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    pattern_ingester:
      enabled: true
    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
      retention_period: 336h # 14 days retention
    querier:
      max_concurrent: 4

    storage:
      type: s3
      bucketNames:
        chunks: loki
        ruler: loki
        admin: loki
      s3:
        endpoint: https://s3.homelab.internal
        s3ForcePathStyle: true
        insecure: false

  deploymentMode: SimpleScalable

  backend:
    replicas: 1
  read:
    replicas: 1
  write:
    replicas: 1

  # Disable minio storage
  minio:
    enabled: false

tempo:
  extraVolumes:
  - name: ca-trust-bundle
    configMap:
      name: ca-trust-bundle

  tempo:
    extraEnvFrom:
    - secretRef:
        name: s3-access-credentials-admin


    extraVolumeMounts:
    - name: ca-trust-bundle
      mountPath: /etc/ssl/certs/ca-certificates.crt
      subPath: trust-bundle.pem
      readOnly: true

    multitenancyEnabled: false
    storage:
      trace:
        backend: s3
        s3:
          endpoint: s3.homelab.internal
          bucket: tempo
          insecure: false
        wal:
          path: /var/tempo/wal
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

alloy:
  controller:
    type: daemonset

    volumes:
      extra:
      - name: ca-trust-bundle
        configMap: 
          name: ca-trust-bundle

  alloy:
    mounts:
      extra:
      - name: ca-trust-bundle
        mountPath: /etc/ssl/certs/ca-certificates.crt
        subPath: trust-bundle.pem
        readOnly: true

    configMap:
      content: |
          // Collect Kubernetes Pod Logs and ship to Loki
          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              action = "replace"
              target_label = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              action = "replace"
              target_label = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              action = "replace"
              target_label = "container"
            }
          }

          loki.source.kubernetes "pod_logs" {
            targets    = discovery.relabel.pod_logs.output
            forward_to = [loki.write.endpoint.receiver]
          }

          loki.write "endpoint" {
            endpoint {
              url = "https://loki-gateway.homelab.internal/loki/api/v1/push"
              tenant_id = "infrastructure"
            }
          }

          // Receive OTLP Traces from Applications and forward to Tempo
          otelcol.receiver.otlp "default" {
            grpc {
              endpoint = "0.0.0.0:4317"
            }
            http {
              endpoint = "0.0.0.0:4318"
            }
            output {
              traces = [otelcol.exporter.otlp.tempo.input]
            }
          }

          otelcol.exporter.otlp "tempo" {
            client {
              endpoint = "tempo.homelab.internal:4317"
              tls {
                insecure = false
                insecure_skip_verify = false
              }
            }
          }